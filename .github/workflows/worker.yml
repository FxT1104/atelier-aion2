name: Publier le relais Cloudflare

on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/worker.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - if: env.HAS_TOKEN != 'true'
        run: echo "Secrets Cloudflare absents, relais non publié."
      - name: Préparer le stockage des alertes (Workers KV)
        if: env.HAS_TOKEN == 'true'
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          ACC=$(grep account_id worker/wrangler.toml | cut -d'"' -f2)
          API="https://api.cloudflare.com/client/v4/accounts/$ACC/storage/kv/namespaces"
          ID=$(curl -s -H "Authorization: Bearer $CF_TOKEN" "$API?per_page=100" | jq -r '.result[]? | select(.title=="atelier-aion2-alertes") | .id')
          if [ -z "$ID" ]; then
            ID=$(curl -s -X POST -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" -d '{"title":"atelier-aion2-alertes"}' "$API" | jq -r '.result.id')
          fi
          if [ -z "$ID" ] || [ "$ID" = "null" ]; then echo "::error::Impossible de créer le stockage des alertes (droits de la clé API ?)"; exit 1; fi
          printf '\n[[kv_namespaces]]\nbinding = "ALERTS"\nid = "%s"\n' "$ID" >> worker/wrangler.toml
      - if: env.HAS_TOKEN == 'true'
        id: wr
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: worker
      - if: env.HAS_TOKEN == 'true'
        run: |
          echo "::notice title=Adresse du relais::${{ steps.wr.outputs.deployment-url }}"
          echo "Adresse du relais : ${{ steps.wr.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"
