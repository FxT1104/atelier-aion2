name: Publier le relais Cloudflare

on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/worker.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - if: env.HAS_TOKEN != 'true'
        run: echo "Secrets Cloudflare absents, relais non publié."
      - if: env.HAS_TOKEN == 'true'
        id: wr
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: worker
      - if: env.HAS_TOKEN == 'true'
        run: |
          echo "::notice title=Adresse du relais::${{ steps.wr.outputs.deployment-url }}"
          echo "Adresse du relais : ${{ steps.wr.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"
